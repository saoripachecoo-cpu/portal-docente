<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Portal Docente</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="login">
        <div class="login-contenedor">
            <div class="logo">
                <img src="img/images.png" alt="imagen del logo">
            </div>
            <h1>Portal Docente</h1>
            <p class="descripcion">
                Ingresa con tus credenciales para continuar
            </p>
            <form id="formLogin">
                <div class="campo">
                    <label for="usuario">Usuario</label>
                    <input required type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario">
                </div>
                <div class="campo">
                    <label for="password">Contraseña</label>
                    <input required type="password" id="password" name="password" placeholder="Ingresa tu contraseña">
                </div>
                <div class="opciones">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit">
                    Ingresar
                </button>
                <p id="mensaje"></p>
            </form>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
